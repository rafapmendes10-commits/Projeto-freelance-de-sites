<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Prévia do site</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style id="estilo-base">body{margin:0;font-family:Inter,system-ui,sans-serif;background:#fff;color:#0f172a}.erro{max-width:520px;margin:15vh auto;padding:24px;text-align:center}</style>
</head>
<body>
  <div id="raiz"><p class="erro">Carregando prévia...</p></div>
  <script type="module">
    import { decodificar, renderizarCorpo, CSS_SITE } from './assets/js/modelo-site.js';
    const raiz = document.getElementById('raiz');
    try {
      const codigo = new URLSearchParams(location.hash.slice(1)).get('d');
      if (!codigo) throw new Error('sem dados');
      const d = decodificar(codigo);
      const { html, c1, c2 } = renderizarCorpo(d, { previa: true });
      const estilo = document.createElement('style');
      estilo.textContent = `:root{--c1:${c1};--c2:${c2}}${CSS_SITE}`;
      document.head.appendChild(estilo);
      document.title = `${d.n} | Prévia do site`;
      raiz.innerHTML = html;
    } catch (e) {
      raiz.innerHTML = '<div class="erro"><h1>Link de prévia inválido</h1><p>Peça um novo link a quem te enviou esta prévia.</p></div>';
    }
  </script>
</body>
</html>
